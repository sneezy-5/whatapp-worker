services:
  worker:
    build:
      context: .
      dockerfile: DockerFile
    image: whatsapp-worker:latest
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://guest:guest@213.199.54.136:5672
      NODE_ENV: production
      WAHA_IMAGE: devlikeapro/waha:latest
      WAHA_ENGINE: WEBJS
      DOCKER_NETWORK: waha-network
      WEBHOOK_PORT: "3001"
      WORKER_PUBLIC_URL: http://worker:3001
    volumes:
      # Lets the worker create/manage sibling WAHA containers via the Docker
      # Engine API (dockerode) - equivalent to root on the host, required by
      # the "one WAHA container per number" architecture.
      - /var/run/docker.sock:/var/run/docker.sock
    # GID of /var/run/docker.sock on the host (213.199.54.136), so the
    # non-root nodejs user in the image can talk to the socket. Re-check with
    # `stat -c '%g' /var/run/docker.sock` if this worker is ever redeployed
    # on a different host - the GID is host-specific, not portable.
    group_add:
      - "989"
    networks:
      - waha-network
    # Sonde passive : interroge /health (200 seulement si RabbitMQ est
    # connecté ET consomme). Après 3 échecs consécutifs le conteneur passe
    # "unhealthy" → le restart_policy / l'orchestrateur le redémarre, ce qui
    # relance setupConsumers(). Filet de sécurité en plus de la reconnexion
    # interne, pas à la place.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      resources:
        limits:
          cpus: '0.5'
          memory: 512MB
        reservations:
          cpus: '0.25'
          memory: 256MB

networks:
  # Dedicated bridge network for the worker + the WAHA containers it creates
  # dynamically (one per WhatsApp number). Deliberately NOT the shared
  # `whatsapp-network` Swarm overlay used by other stacks (rabbitmq,
  # backend, postgres...) on this host - that network is not "attachable"
  # so standalone containers (this compose, and dockerode-created WAHA
  # containers) can't join it, and recreating it would risk every other
  # stack on the cluster. The worker doesn't need it anyway: it reaches
  # RabbitMQ over the public RABBITMQ_URL above, not container DNS.
  waha-network:
    name: waha-network
    driver: bridge
